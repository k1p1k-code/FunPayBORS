[workspace]
resolver = "3"
members = [
    "./connector",
    "./models",
    "./server",
    "./python_plugins"
]

[workspace.dependencies]
funpay-client = "0.2.3"
tokio = { version = "1", features = ["full"] }
serde_json = "1.0.145"
serde = { version = "1.0.228", features = ["derive"] }
axum = "0.8.8"
python_plugins={path = "python_plugins"}
models={path = "models"}
server={path = "server"}
pyo3 = { version = "0.28.0"}